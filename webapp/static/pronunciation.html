<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оценка произношения</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <h1>Оценка произношения</h1>
    <p class="subtitle">Оценка твоего голосового сообщения</p>

    <div id="content">
        <p class="loading">Загружаю...</p>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        tg?.ready();
        tg?.expand();

        const sessionId = window.location.pathname.split("/").pop();

        const METRICS = [
            { key: "accuracy", label: "Точность", source: "pronunciation" },
            { key: "fluency", label: "Беглость речи", source: "pronunciation" },
            { key: "prosody", label: "Интонация", source: "pronunciation" },
            { key: "grammar", label: "Грамматика", source: "content" },
            { key: "vocabulary", label: "Словарный запас", source: "content" },
        ];

        async function load() {
            const container = document.getElementById("content");
            try {
                const res = await fetch(`/api/assessment/${sessionId}`);
                if (!res.ok) throw new Error("not found");
                const data = await res.json();
                render(container, data);
            } catch (e) {
                container.innerHTML = '<p class="error">Не удалось загрузить оценку произношения.</p>';
            }
        }

        function render(container, data) {
            const rows = [];
            for (let i = 0; i < METRICS.length; i += 2) {
                rows.push(METRICS.slice(i, i + 2));
            }

            const metricsHtml = rows.map(pair => `
                <div class="metric-row">
                    ${pair.map(m => metricHtml(m, data[m.source][m.key])).join("")}
                </div>`).join("");

            container.innerHTML = `
                <div class="card">${metricsHtml}</div>
                <div class="card">
                    <p class="tip">${escapeHtml(data.content.tip_ru)}</p>
                </div>
                <div class="card">
                    <p class="transcript-label">Транскрипт</p>
                    <p class="phrase" style="margin:0; font-size:17px;">${escapeHtml(data.pronunciation.transcript)}</p>
                </div>`;
        }

        function metricHtml(metric, value) {
            return `
                <div class="metric">
                    <div class="metric-label">
                        <span>${metric.label}</span>
                        <span>${value}</span>
                    </div>
                    <div class="metric-bar-track">
                        <div class="metric-bar-fill" style="width: ${value}%;"></div>
                    </div>
                </div>`;
        }

        function escapeHtml(str) {
            const div = document.createElement("div");
            div.textContent = str ?? "";
            return div.innerHTML;
        }

        load();
    </script>
</body>
</html>
